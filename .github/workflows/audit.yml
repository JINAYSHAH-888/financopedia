name: audit

# The output is only worth anything if the gates still fire, so CI runs the
# real thing: it recalculates every workbook through LibreOffice, rebuilds the
# research PDF, and compares both against the independent Python engines.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreOffice (needed to recalculate the workbooks)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build and audit every deliverable
        run: bash tests/run_all.sh

      - name: Confirm the model gates still catch deliberate errors
        run: python3 tests/test_sabotage.py

      - name: Confirm the research gates still catch deliberate errors
        run: python3 tests/test_research_sabotage.py
